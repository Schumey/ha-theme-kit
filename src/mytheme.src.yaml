# ---------- Variant that follows Profile → Theme → Mode (light/dark) ----------
My Theme Auto:
  <<: *base
  card-mod-theme: My Theme Auto
  modes:
    light: {}
    dark:
      mytheme-bg: "#101820"
      mytheme-bg-text: "#e0e0e0"
      mytheme-face: "#222c36"
      mytheme-border: "#4a5866"
      mytheme-text: "#e8e8e8"
      mytheme-text-dim: "#a8b0b8"
      mytheme-window: "#141c24"
      mytheme-window-text: "#e8e8e8"
      mytheme-title: "#1c3a5a"
      mytheme-select: "#3a8ad8"
      rgb-primary-color: "58, 138, 216"
      rgb-accent-color: "58, 138, 216"
      rgb-primary-text-color: "232, 232, 232"
      rgb-primary-background-color: "34, 44, 54"
      rgb-card-background-color: "34, 44, 54"
